name: pada-final-test
on:
  push:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Identity
        run: |
          echo "Runner: $(hostname)"
          echo "CPU cores: $(nproc), RAM: $(free -h | awk '/^Mem:/ {print $2}')"
          cat /etc/os-release | head -3
      - name: Docker available?
        run: |
          docker version --format 'Server: {{.Server.Version}}'
          docker run --rm alpine:3.20 echo "✓ real container ran via auto-mounted host docker"
  debian-test:
    runs-on: debian-13
    steps:
      - name: Hello from Debian container
        run: |
          cat /etc/os-release | head -3
          echo "PATH: $PATH"
